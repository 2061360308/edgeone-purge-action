name: 'Tencent EdgeOne Purge Action'
description: 'Purge cache in Tencent EdgeOne'
author: '盧瞳/LuTong'

branding:
  icon: 'zap'
  color: 'blue'

inputs:
  secret_id:
    description: 'Tencent Cloud Secret ID'
    required: true
  secret_key:
    description: 'Tencent Cloud Secret Key'
    required: true
  zone_id:
    description: 'EdgeOne Zone ID'
    required: true
  type:
    description: 'Cache type: purge_host or purge_prefix (directory)'
    required: true
    default: 'purge_host'
  hostnames:
    description: 'Comma-separated list of hostnames to purge (type=purge_host)'
    required: false
  paths:
    description: 'Comma/newline-separated list of directory URLs to purge (type=purge_prefix)'
    required: false
  method:
    description: 'Purge method for directory refresh: invalidate or delete'
    required: false
    default: 'invalidate'

runs:
  using: 'node20'
  main: 'dist/main.js'